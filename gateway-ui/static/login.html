<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gateway-ui — вход</title>
<script>
  (function () { try { document.documentElement.dataset.theme = localStorage.getItem('gw-theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; } })();
</script>
<style>
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg:#0f1115; --panel:#191c23; --border:#333; --text:#e6e6e6;
    --accent:#3b82f6; --accent-h:#2f6fd6; --bad:#f87171; --input-bg:#0f1115;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg:#f4f5f7; --panel:#ffffff; --border:#d9dce1; --text:#1c2024;
    --accent:#2563eb; --accent-h:#1d4ed8; --bad:#b91c1c; --input-bg:#ffffff;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .card { background:var(--panel); padding:32px; border-radius:12px; width:300px;
          border:1px solid var(--border); box-shadow:0 8px 30px rgba(0,0,0,.25); }
  h1 { font-size:18px; margin:0 0 20px; }
  input { width:100%; padding:10px; margin-bottom:14px;
          border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent-h); }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:42px; }
  .pw-eye { position:absolute; top:8px; right:6px; width:auto; margin:0; padding:3px 5px;
            background:none; border:0; border-radius:6px; color:var(--text); opacity:.6;
            font-size:16px; line-height:1; cursor:pointer; }
  .pw-eye:hover { background:none; opacity:1; }
  .err { color:var(--bad); font-size:13px; margin-bottom:12px; }
  .hint { color:var(--text); font-size:11px; margin:-8px 0 14px; opacity:.6; }
  .theme-toggle { position:fixed; top:16px; right:16px; width:auto; padding:6px 10px;
                  background:none; border:1px solid var(--border); border-radius:8px;
                  color:var(--text); font-size:15px; cursor:pointer; }
  .theme-toggle:hover { border-color:var(--accent); background:none; }
</style>
</head>
<body>
  <button id="themeBtn" class="theme-toggle" type="button" title="Сменить тему">🌙</button>
  <form class="card" method="POST" action="/login">
    <h1>🛡️ gateway-ui</h1>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <div class="pw-wrap">
      <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password"
             autofocus required inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="pwEye" class="pw-eye" type="button" title="Показать пароль" aria-label="Показать пароль">👁️</button>
    </div>
    <div class="hint">Только латиница/цифры — кириллица отфильтровывается на лету</div>
    <button type="submit">Войти</button>
  </form>
  <script>
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
      try { localStorage.setItem('gw-theme', t); } catch (e) {}
    }
    applyTheme(document.documentElement.dataset.theme || 'dark');
    themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    // Показать/скрыть пароль — чтобы видеть введённое и не стирать всё при опечатке
    const pw = document.getElementById('pw'), pwEye = document.getElementById('pwEye');
    pwEye.onclick = () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      pwEye.textContent = show ? '🙈' : '👁️';
      pwEye.title = show ? 'Скрыть пароль' : 'Показать пароль';
      pw.focus();
    };
    // Только английская раскладка: печатаемый ASCII (0x20-0x7E) — молча
    // отрезаем всё остальное (кириллицу и т.п.), чтобы не набрать пароль
    // в чужой раскладке незаметно для себя.
    pw.addEventListener('input', () => {
      const filtered = pw.value.replace(/[^\x20-\x7E]/g, '');
      if (filtered !== pw.value) pw.value = filtered;
    });
  </script>
</body>
</html>
