<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shattl Gateway — вход</title>
<script>
  (function () { try { document.documentElement.dataset.theme = localStorage.getItem('gw-theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; } })();
</script>
<style>
  /* Та же палитра, что и в web-src/src/index.css (React SPA) — логин
     намеренно не React-компонент (проще остаться простым HTML-шаблоном
     до апгрейда сессии), но должен выглядеть одним продуктом с остальной
     панелью, не отдельной "старой" страницей. */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg:#09090B; --surface:#111318; --surface-raised:#16181E;
    --text:#F5F5F5; --text-secondary:#A1A1AA; --text-muted:#6B6B72;
    --accent:#67E8F9; --danger:#EF4444;
    --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.14);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg:#FAFAFA; --surface:#FFFFFF; --surface-raised:#FFFFFF;
    --text:#18181B; --text-secondary:#6B6B76; --text-muted:#A0A0A8;
    --accent:#0E7C90; --danger:#C6302B;
    --border:rgba(15,15,20,0.08); --border-strong:rgba(15,15,20,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", sans-serif;
    font-size:14px; background:var(--bg); color:var(--text);
    transition: background .3s ease, color .3s ease;
  }
  .mark {
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; margin:0 auto 20px; border-radius:10px;
    border:1px solid var(--border-strong); position:relative;
  }
  .mark::before {
    content:""; width:8px; height:8px; border-radius:50%; border:1px solid var(--accent);
  }
  .mark::after {
    content:""; position:absolute; inset:-4px; border-radius:10px;
    border:1px solid var(--accent); opacity:.35;
  }
  .card {
    background:var(--surface); padding:32px; border-radius:10px; width:300px;
    border:1px solid var(--border);
  }
  h1 {
    font-size:15px; font-weight:500; margin:0 0 22px; text-align:center;
    letter-spacing:.02em; color:var(--text-secondary);
    text-transform:uppercase; font-size:11px;
  }
  input {
    width:100%; padding:10px 12px; margin-bottom:14px; font-size:13px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--surface-raised); color:var(--text);
    font-family: "SF Mono", "Berkeley Mono", ui-monospace, monospace;
  }
  input:focus { outline:none; border-color:var(--border-strong); }
  button[type="submit"] {
    width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent);
    color:#08181A; font-weight:600; font-size:13px; cursor:pointer;
    transition: opacity .15s ease;
  }
  button[type="submit"]:hover { opacity:.85; }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:42px; }
  .pw-eye {
    position:absolute; top:6px; right:4px; width:auto; margin:0; padding:4px 6px;
    background:none; border:0; border-radius:6px; color:var(--text-muted); opacity:.8;
    font-size:15px; line-height:1; cursor:pointer;
  }
  .pw-eye:hover { color:var(--text); }
  .err {
    color:var(--danger); font-size:12px; margin-bottom:12px;
    padding:8px 10px; border-radius:6px; background:rgba(239,68,68,0.1);
  }
  .hint { color:var(--text-muted); font-size:10.5px; margin:-8px 0 14px; }
  .theme-toggle {
    position:fixed; top:16px; right:16px; width:auto; padding:6px 10px;
    background:none; border:1px solid var(--border); border-radius:8px;
    color:var(--text-muted); font-size:15px; cursor:pointer;
  }
  .theme-toggle:hover { border-color:var(--border-strong); color:var(--text); }
</style>
</head>
<body>
  <button id="themeBtn" class="theme-toggle" type="button" title="Сменить тему">🌙</button>
  <form class="card" method="POST" action="{{.Prefix}}/login">
    <div class="mark"></div>
    <h1>Shattl Gateway</h1>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <!-- скрытое поле username — не для сервера (сервер его не читает), а
         чтобы password manager браузера сохранял пароль этого шлюза ОТДЕЛЬНО
         от остальных (все шлюзы за прокси на одном origin, форма иначе
         неотличима, см. коммент к hostname в main.go handleLogin). -->
    <input type="text" name="username" value="{{.Hostname}}" autocomplete="username" style="display:none">
    <div class="pw-wrap">
      <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password"
             autofocus required inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="pwEye" class="pw-eye" type="button" title="Показать пароль" aria-label="Показать пароль">👁️</button>
    </div>
    <div class="hint">Только латиница/цифры — кириллица отфильтровывается на лету</div>
    <button type="submit">Войти</button>
  </form>
  <script>
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      themeBtn.textContent = t === 'light' ? '☀️' : '🌙';
      try { localStorage.setItem('gw-theme', t); } catch (e) {}
    }
    applyTheme(document.documentElement.dataset.theme || 'dark');
    themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    const pw = document.getElementById('pw'), pwEye = document.getElementById('pwEye');
    pwEye.onclick = () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      pwEye.textContent = show ? '🙈' : '👁️';
      pwEye.title = show ? 'Скрыть пароль' : 'Показать пароль';
      pw.focus();
    };
    // Только английская раскладка: печатаемый ASCII (0x20-0x7E) — молча
    // отрезаем всё остальное (кириллицу и т.п.), чтобы не набрать пароль
    // в чужой раскладке незаметно для себя.
    pw.addEventListener('input', () => {
      const filtered = pw.value.replace(/[^\x20-\x7E]/g, '');
      if (filtered !== pw.value) pw.value = filtered;
    });
  </script>
</body>
</html>
